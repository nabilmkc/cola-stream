```yaml
name: Update Cola M3U

on:
  schedule:
    # Jalan setiap 15 menit
    - cron: "*/15 * * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Jalankan scraper
        run: python scraper.py

      - name: Simpan cola.m3u ke repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cola.m3u

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan pada cola.m3u"
          else
            git commit -m "Update cola.m3u"
            git push
          fi
```
